name: Build portable executables
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux deps (tkinter, hidapi build)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk libudev-dev libusb-1.0-0-dev libhidapi-dev
      - run: python -m pip install pyinstaller hidapi pillow
      - run: python -m PyInstaller --onefile --windowed --name AULA_Uploader aula_uploader.py -y
      - run: python -m PyInstaller --onefile --console --name AULA_Uploader_CLI aula_uploader.py -y
      - uses: actions/upload-artifact@v4
        with:
          name: AULA_Uploader-${{ runner.os }}
          path: dist/*
